    <main>

        <section class="suporte">

        <h1>Precisa de ajuda?</h1>

        <p>Envie sua dúvida ou problema para a equipe do Scambo.</p>

            <form>

                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome">

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Seu E-mail">

                <label for="assunto">Assunto</label>
                <input type="text" id="assunto" name="assunto" placeholder="com o que você precisa de ajuda?">

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" placeholder="Descreva o seu problema"></textarea>

                <button type="submit">Enviar mensagem</button>

            </form>

        </section>

    </main>
